<style>
/* Layout: cut-out object hung off the top-left edge; file-extension menu as a quiet column right of centre.
   Every tunable value is a token below; the dev panel writes these same tokens. */
:root{
  --field:#ffffff; --signal:#92b983; --hover:#89b2d2; --ink:#1a1a18;
  --vh:100vh;
  --menu-size:calc(var(--vh)*.08);
  --menu-pitch:calc(var(--vh)*.19);
  --font:"Helvetica Neue", Helvetica, Arial, sans-serif;
  --weight:380; --type-scale:3.31; --stretch:2.58; --fstretch:115%; --track:-.24em;
  --italic:normal; --case:none; --fvs:normal;
  --pitch-scale:.3; --drift:-42.5px; --menu-dx:-30.1vw; --menu-dy:5.1vh;

}
@supports (height:100dvh){:root{--vh:100dvh}}
html,body{height:100%}
*{-webkit-tap-highlight-color:transparent}
body{background:var(--field);color:var(--ink);overflow:hidden;font-family:var(--sans);transition:background-color var(--fade);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.home{position:fixed;inset:0;background:var(--field);transition:background-color var(--fade);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}

/* object: full-res transparent cut-out; scales about its own centre */
.img-slot{position:absolute;overflow:hidden}
.img-slot img{width:100%;height:100%;object-fit:contain;object-position:left top;display:block;pointer-events:none;-webkit-user-drag:none}
.object{--oh:calc(var(--vh)*1.15); --ow:calc(var(--oh)*1581/2463);
  left:calc(-10vw + var(--vh)*.1283 + var(--dx) - (var(--object-scale) - 1)*var(--ow)/2);
  top:calc(var(--vh)*-.2181 + var(--dy) - (var(--object-scale) - 1)*var(--oh)/2);
  height:calc(var(--oh)*var(--object-scale));aspect-ratio:1581/2463}
.object img{opacity:var(--object-opacity)}
/* layering: words live behind the bag and rise out of it */
.object{z-index:2;pointer-events:none}
nav{position:absolute;inset:0;z-index:1;pointer-events:none}
.menu a{pointer-events:auto}

.home{touch-action:none}
.home.over-bag{cursor:grab}
.home.dragging{cursor:grabbing}
.menu .ch{display:inline-block;will-change:transform}

/* menu */
.menu{position:absolute;left:calc(77% + var(--menu-dx));top:calc(50% + var(--menu-dy));transform:translate(-50%,-50%) translateY(calc(var(--vh)*.004));
  margin:0;padding:0;list-style:none;display:flex;flex-direction:column;align-items:center}
.menu li{height:calc(var(--menu-pitch)*var(--pitch-scale));display:flex;align-items:center}
.menu li:nth-child(2){transform:translateX(var(--drift))}
.menu li:nth-child(3){transform:translateX(calc(var(--drift)*2))}
.menu li:nth-child(4){transform:translateX(calc(var(--drift)*3))}
.menu a{display:inline-block;color:var(--signal);text-decoration:none;line-height:1;padding:.1em .15em;

.menu a:hover,.menu a:focus-visible{outline:none;color:var(--hover)}

/* landscape: bag locked to the window, mouth centred; words land where the diagram's red arcs end */
@media (orientation:landscape){
  .object{--ow:calc(85vw * var(--object-scale)); --oh:calc(var(--ow)*2463/1581);
    width:var(--ow);height:var(--oh);left:calc(50vw - var(--ow)*.45 + var(--dx));top:calc(50vh - var(--oh)*.655 + var(--dy))}
  :root{--menu-size:4.6vw}
  nav{z-index:3}                                   /* once out of the bag, letters fly in front of it */
  .menu{left:var(--menu-dx);top:var(--menu-dy);width:100%;height:100%;transform:none;display:block}
  .menu li:nth-child(n){position:absolute;height:auto;left:calc(var(--wx)*1%);top:calc(var(--wy)*1%);transform:translate(-50%,-50%)}
  .menu li:nth-child(1){--wx:56.7;--wy:21.3}  /* locked from Jack's export, 1544x752 */
  .menu li:nth-child(2){--wx:25;--wy:13.4}  /* locked from Jack's export, 1544x752 */
  .menu li:nth-child(3){--wx:32.5;--wy:35.3}  /* locked from Jack's export, 1544x752 */
  .menu li:nth-child(4){--wx:30.7;--wy:82.7}  /* locked from Jack's export, 1544x752 */
}

/* portrait: whole bag up top; menu stack laid across the bag's rim */
@media (orientation:portrait){
  .object{--oh:calc(var(--vh)*.6);
    left:calc(50% - var(--ow)/2 + var(--dx) - (var(--object-scale) - 1)*var(--ow)/2);
    top:calc(var(--vh)*.02 + env(safe-area-inset-top,0px) + var(--dy) - (var(--object-scale) - 1)*var(--oh)/2)}
  :root{--menu-size:calc(var(--vh)*.05);--menu-pitch:calc(var(--vh)*.09)}   /* vh, so the stack tracks the bag's size */
  .menu{left:calc(50% + var(--menu-dx));top:calc(50% + var(--menu-dy));transform:translate(-50%,-50%)}
}

/* menu on/off switch */
nav{transition:opacity .35s ease}
body.menu-off nav{opacity:0;pointer-events:none}
.switch{position:fixed;z-index:20;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:calc(14px + env(safe-area-inset-left,0px));
  width:34px;height:18px;padding:0;border-radius:9px;border:1px solid rgba(26,26,24,.3);background:transparent;cursor:pointer;
  opacity:.55;transition:opacity .2s,background .2s,border-color .2s;-webkit-user-select:none;user-select:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:rgba(26,26,24,.45);transition:transform .2s ease,background .2s}
.switch[aria-pressed="true"]{background:var(--signal);border-color:var(--signal)}
.switch[aria-pressed="true"]::after{transform:translateX(16px);background:var(--field)}
.switch:hover,.switch:focus-visible{opacity:1}
.switch:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){nav,.switch,.switch::after{transition:none}}

/* corner tools */
.tool{position:fixed;z-index:20;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:calc(14px + env(safe-area-inset-right,0px));
  width:26px;height:26px;padding:0;border-radius:50%;border:1px solid rgba(26,26,24,.25);background:transparent;
  color:rgba(26,26,24,.55);font:11px/1 var(--sans);cursor:pointer;opacity:.35;transition:opacity .2s;-webkit-user-select:none;user-select:none}
.tool.move-toggle{right:calc(82px + env(safe-area-inset-right,0px));font-size:13px}
body.arranging .menu a{cursor:move;outline:1px dashed rgba(26,26,24,.35);outline-offset:4px;touch-action:none}
body.arranging .menu a.held{outline-style:solid}
.export{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));
  font:11px/1 var(--mono);letter-spacing:.04em;padding:8px 12px;border-radius:14px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.export:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.export-out{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(52px + env(safe-area-inset-bottom,0px));
  width:min(420px,calc(100vw - 32px));height:120px;font:10px/1.4 var(--mono);border:1px solid var(--ink);border-radius:4px;padding:6px;background:#fff;color:var(--ink)}
.tool.dev-toggle{right:calc(48px + env(safe-area-inset-right,0px));font:600 10px/1 var(--mono);letter-spacing:-.02em}
.tool:hover,.tool:focus-visible{opacity:1}
.tool[aria-pressed="true"]{opacity:1;background:var(--ink);color:#fff;border-color:var(--ink)}
body.editing .img-slot{cursor:copy;outline:1px dashed rgba(26,26,24,.4);outline-offset:-2px}
body.editing [data-edit-text]{cursor:text;outline:1px dashed rgba(26,26,24,.3);outline-offset:2px;-webkit-user-select:text;user-select:text}
.img-slot.drag{outline:1px solid var(--ink)!important}

/* dev panel */
.dev{position:fixed;z-index:30;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));
  width:min(300px, calc(100vw - 24px));max-height:calc(var(--vh) - 70px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;
  background:var(--dev-bg);color:var(--dev-fg);border:1px solid var(--dev-line);border-radius:6px;
  font:11px/1.3 var(--mono);box-shadow:0 8px 28px rgba(26,26,24,.16);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.dev header{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;
  background:var(--dev-bg);border-bottom:1px solid var(--dev-line);text-transform:uppercase;letter-spacing:.08em;font-size:10px}
.dev header button{all:unset;cursor:pointer;padding:2px 4px;font-size:13px;color:var(--dev-dim)}
.dev details{border-bottom:1px solid var(--dev-line)}

.dev summary::-webkit-details-marker{display:none}
.dev summary::before{content:"▸ ";}
.dev details[open] summary::before{content:"▾ ";}
.dev .rows{display:grid;gap:6px;padding:2px 10px 10px}
.dev .row{display:grid;grid-template-columns:92px minmax(0,1fr) 52px;align-items:center;gap:6px}
.dev .row.wide{grid-template-columns:92px minmax(0,1fr)}
.dev label{color:var(--dev-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev input[type=range]{width:100%;margin:0;accent-color:var(--dev-fg)}
.dev input[type=number],.dev input[type=text],.dev select{width:100%;min-width:0;box-sizing:border-box;font:inherit;color:inherit;
  background:#fff;border:1px solid var(--dev-line);border-radius:3px;padding:3px 4px}
.dev input[type=number]{font-variant-numeric:tabular-nums;text-align:right}
.dev input[type=color]{width:100%;height:22px;padding:0;border:1px solid var(--dev-line);border-radius:3px;background:#fff}
.dev input[type=checkbox]{justify-self:start;margin:0;accent-color:var(--dev-fg)}
.dev .swatches{display:flex;gap:4px}
.dev .swatches input{flex:1}
.dev .btns{display:flex;flex-wrap:wrap;gap:6px}
.dev .btns button{font:inherit;color:inherit;background:#fff;border:1px solid var(--dev-line);border-radius:3px;padding:4px 8px;cursor:pointer}
.dev .btns button:hover{border-color:var(--dev-fg)}
.dev :focus-visible{outline:1px solid var(--dev-fg);outline-offset:1px}
.dev textarea{width:100%;box-sizing:border-box;height:120px;font:10px/1.35 var(--mono);border:1px solid var(--dev-line);border-radius:3px;padding:6px;resize:vertical}
.dev .note{color:var(--dev-dim);font-size:10px}
</style>

<script>
(function(){
  const KEY='nmm-home:';
  const get=k=>{try{return localStorage.getItem(KEY+k)}catch(e){return null}};
  const set=(k,v)=>{try{localStorage.setItem(KEY+k,v)}catch(e){}};
  const root=document.documentElement.style, home=document.querySelector('.home'), obj=document.querySelector('.object');
  let editing=false;

  /* ---------- settings: defaults are the published look ---------- */
  // shared typeface/background settings + one layout profile per orientation
  const LK=['size','pitch','drift','menuX','menuY','objScale','objOpacity','objX','objY','words'];
  const DEFAULTS={
    font:'Helvetica Neue (system)', customFont:'', weight:380, stretch:2.58, fontStretch:115, tracking:-.24,
    italic:false, textCase:'none', fvs:'', color:'#92b983', hover:'#89b2d2',
    palette:['#ffffff','#c1bcac','#8dfc91','#c9b9ff','#ffa175'], bg:0, cycle:true, fade:1000,
    layout:{
      land:{size:1, pitch:1, drift:0, menuX:0, menuY:0, objScale:1, objOpacity:1, objX:0, objY:0, words:[[56.7,21.3],[25,13.4],[32.5,35.3],[30.7,82.7]]},
      port:{size:1.23, pitch:.147, drift:-10.8, menuX:2.5, menuY:-14.4, objScale:1, objOpacity:1, objX:0, objY:0, words:[[56.7,21.3],[25,13.4],[32.5,35.3],[30.7,82.7]]}
    }
  };
  const FONTS={
    'Helvetica Neue (system)':{css:'"Helvetica Neue", Helvetica, Arial, sans-serif'},
    'Archivo':'Archivo:wdth,wght@62..125,100..900',
    'Anybody':'Anybody:wdth,wght@50..150,100..900',
    'Roboto Flex':'Roboto+Flex:wdth,wght@25..151,100..1000',
    'Bricolage Grotesque':'Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800',
    'Schibsted Grotesk':'Schibsted+Grotesk:wght@400..900',
    'Hanken Grotesk':'Hanken+Grotesk:wght@100..900',
    'Familjen Grotesk':'Familjen+Grotesk:wght@400..700',
    'Darker Grotesque':'Darker+Grotesque:wght@300..900',
    'Work Sans':'Work+Sans:wght@100..900',
    'Manrope':'Manrope:wght@200..800',
    'Unbounded':'Unbounded:wght@200..900',
    'Syncopate':'Syncopate:wght@400;700',
    'Michroma':'Michroma',
    'Krona One':'Krona+One',
    'Lexend Zetta':'Lexend+Zetta:wght@100..900',
    'Lexend Giga':'Lexend+Giga:wght@100..900',
    'Space Mono':'Space+Mono:wght@400;700',
    'IBM Plex Mono':'IBM+Plex+Mono:wght@100;200;300;400;500;600;700',
    'JetBrains Mono':'JetBrains+Mono:wght@100..800',
    'Instrument Serif':'Instrument+Serif',
    'Fraunces':'Fraunces:opsz,wght@9..144,100..900',
    'Bodoni Moda':'Bodoni+Moda:opsz,wght@6..96,400..900',
    'Custom (Google Fonts name)':{custom:true}
  };
  const clone=o=>JSON.parse(JSON.stringify(o));
  let S=clone(DEFAULTS);
  try{ const saved=JSON.parse(get('dev4')||'null');
    if(saved){ const L=saved.layout||{}; delete saved.layout; Object.assign(S,saved);
      ['land','port'].forEach(o=>Object.assign(S.layout[o],L[o]||{})) } }catch(e){}
  const mq=matchMedia('(orientation: portrait)'); let orient=mq.matches?'port':'land';
  const pull=()=>LK.forEach(k=>S[k]=S.layout[orient][k]);   // profile -> live values
  const push=()=>LK.forEach(k=>S.layout[orient][k]=S[k]);   // live values -> profile
  pull();

  // Google Fonts: try the variable range first, fall back to the plain family
  const loaded=new Set();
  function loadFont(spec,fallback){
    if(!spec||loaded.has(spec)) return; loaded.add(spec);
    const l=document.createElement('link'); l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family='+spec+'&display=swap';
    if(fallback) l.onerror=()=>{ l.remove(); loadFont(fallback) };
    document.head.appendChild(l);
  }
  function fontCss(){
    const f=FONTS[S.font];
    if(f&&f.css) return f.css;
    let name;
    if(f&&f.custom){ name=S.customFont.trim(); if(!name) return DEFAULTS_FONT;
      const q=name.replace(/\s+/g,'+'); loadFont(q+':wght@100..900',q); }

  }

  function tokens(){

      '--font':fontCss(), '--weight':S.weight, '--type-scale':S.size, '--stretch':S.stretch,

    push(); const keep=clone(S); LK.forEach(k=>delete keep[k]); set('dev4',JSON.stringify(keep));
  }
  apply();
  mq.addEventListener('change',()=>{ push(); orient=mq.matches?'port':'land'; pull(); apply(); label(); syncPanel() });

  /* ---------- background: click to cycle the palette ---------- */
  let suppress=false;
  home.addEventListener('click',e=>{
    if(editing||arranging||suppress||!S.cycle||e.target.closest('a')) { suppress=false; return }

  texts.forEach(el=>{

  const load=(slot,file)=>{ if(!file||!file.type.startsWith('image/'))return;
    const r=new FileReader(); r.onload=()=>{slot.querySelector('img').src=r.result; set('i:'+slot.dataset.editImg,r.result)}; r.readAsDataURL(file); };
  document.querySelectorAll('[data-edit-img]').forEach(slot=>{
    const v=get('i:'+slot.dataset.editImg); if(v) slot.querySelector('img').src=v;
    slot.addEventListener('click',e=>{ if(!editing) return; target=slot; picker.value=''; picker.click() });
    slot.addEventListener('dragover',e=>{ if(!editing) return; e.preventDefault(); slot.classList.add('drag') });
    slot.addEventListener('dragleave',()=>slot.classList.remove('drag'));
    slot.addEventListener('drop',e=>{ if(!editing) return; e.preventDefault(); slot.classList.remove('drag'); load(slot,e.dataTransfer.files[0]) });
  });
  picker.addEventListener('change',()=>{ if(target) load(target,picker.files[0]) });
  home.addEventListener('contextmenu',e=>{ if(!editing) e.preventDefault() });

  /* ---------- bag hit-testing: only its visible pixels count, so words behind it stay reachable ---------- */
  const objImg=obj.querySelector('img'); let alpha=null;
  function readAlpha(){
    try{ const w=160,h=Math.max(1,Math.round(160*objImg.naturalHeight/objImg.naturalWidth)), c=document.createElement('canvas');
      c.width=w; c.height=h; const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(objImg,0,0,w,h);
      alpha={w,h,d:x.getImageData(0,0,w,h).data} }catch(e){ alpha=null }
  }
  if(objImg.complete) readAlpha(); objImg.addEventListener('load',readAlpha);
  function onBag(x,y){
    const r=obj.getBoundingClientRect(); if(x<r.left||x>r.right||y<r.top||y>r.bottom) return false;
    if(!alpha) return true;
    const u=Math.min(alpha.w-1,Math.floor((x-r.left)/r.width*alpha.w)), v=Math.min(alpha.h-1,Math.floor((y-r.top)/r.height*alpha.h));
    return alpha.d[(v*alpha.w+u)*4+3]>128;
  }

  /* ---------- drag the bag; a drag never counts as a background click ---------- */
  let drag=null;
  home.addEventListener('pointerdown',e=>{
    if(editing||e.button>0||e.target.closest('a')||!onBag(e.clientX,e.clientY)) return;
    e.preventDefault(); home.setPointerCapture(e.pointerId); home.classList.add('dragging');
    drag={x:e.clientX,y:e.clientY,ox:S.objX,oy:S.objY,moved:false};
  });
  home.addEventListener('pointermove',e=>{
    if(!drag){ if(!editing&&e.pointerType==='mouse') home.classList.toggle('over-bag',onBag(e.clientX,e.clientY)); return }
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>4) drag.moved=true;
    S.objX=Math.round(drag.ox+dx); S.objY=Math.round(drag.oy+dy);
    obj.style.setProperty('--dx',S.objX+'px'); obj.style.setProperty('--dy',S.objY+'px');
  });
  const endDrag=()=>{ if(!drag) return; if(drag.moved){ suppress=true; apply(); syncPanel() } dirty=true; frame.force=true; drag=null; home.classList.remove('dragging') };
  home.addEventListener('pointerup',endDrag); home.addEventListener('pointercancel',endDrag);

  /* ---------- scroll: letters float up out of the bag into the list, and sink back ---------- */
  const RIM=.655, BODY_L=.20, BODY_R=.76;          // where the bag's opening sits, as fractions of the image
  const links=[...document.querySelectorAll('.menu a')];
  var L=[], P=0, goal=0, last=0, dirty=true;   // var: apply() touches these before this block runs
  const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  function split(){
    L=[];
    links.forEach(a=>{
      const txt=a.textContent; a.dataset.raw=txt; a.textContent='';
      [...txt].forEach(c=>{ const s=document.createElement('span'); s.className='ch'; s.textContent=c; a.appendChild(s);
        L.push({el:s, start:rnd(0,.38), lift:rnd(.1,.9), side:rnd(-1,1), spin:rnd(-14,14), phase:rnd(0,6.28)}) });
    });
    dirty=true;
  }
  function join(){ links.forEach(a=>{ if(a.dataset.raw!==undefined) a.textContent=a.dataset.raw }); L=[] }
  function measure(){                                // each letter's resting slot in the list
    L.forEach(l=>l.el.style.transform='none');
    L.forEach(l=>{ l.el.style.clipPath=''; const r=l.el.getBoundingClientRect(); l.x=r.left+r.width/2; l.y=r.top+r.height/2; l.h=r.height; l.w=r.width });
    dirty=false; frame.key++;
  }
  const MOUTH_L=.38, MOUTH_R=.62;                  // where letters leave the opening (fractions of the image width)
  const land=()=>matchMedia('(orientation: landscape)').matches;
  const bez=(a,b,c,d,u)=>{const v=1-u;return v*v*v*a+3*v*v*u*b+3*v*u*u*c+u*u*u*d};
  function arc(l,b,rimY){                          // per letter: launch point, apex and landing, rebuilt when layout changes
    const right=l.x>b.left+b.width*.45;
    const lx=b.left+b.width*(right?rnd(.47,MOUTH_R):rnd(MOUTH_L,.5));
    const sy=rimY+l.h*.62, top=Math.min(sy,l.y)-innerHeight*rnd(.08,.2);
    l.A={x0:lx, y0:sy, x1:lx+(l.x-lx)*.12, y1:top, x2:l.x-(l.x-lx)*.08, y2:top, x3:l.x, y3:l.y};
    let best=0,by=1e9; for(let i=0;i<=40;i++){const y=bez(sy,top,top,l.y,i/40); if(y<by){by=y;best=i/40}} l.A.apex=best;
  }
  function frame(now){
    requestAnimationFrame(frame);
    const dt=Math.min(.05,(now-last)/1000||0); last=now;
    if(editing||!L.length) return;
    if(dirty) measure();
    const k=1-Math.exp(-dt*7); const moved=Math.abs(goal-P)>.0005;
    P+=(goal-P)*k; if(!moved&&!frame.force) return; frame.force=false;
    const b=obj.getBoundingClientRect(), rimY=b.top+b.height*RIM, bl=b.left+b.width*BODY_L, br=b.left+b.width*BODY_R;
    const st=S.stretch||1, isLand=land();
    L.forEach(l=>{
      const t=clamp((P-l.start)/.62);
      if(isLand){
        if(!l.A||l.A.key!==frame.key) { arc(l,b,rimY); l.A.key=frame.key }
        const A=l.A, u=1-Math.pow(1-t,2.2);         // quick pop out of the mouth, soft landing
        const x=bez(A.x0,A.x1,A.x2,A.x3,u), y=bez(A.y0,A.y1,A.y2,A.y3,u);
        const rot=(1-t)*l.spin*1.6*Math.sin(t*4+l.phase);
        const below=u<A.apex ? clamp(y+l.h/2-rimY,0,l.h) : 0;   // still inside the bag: hide what's under the rim
        l.el.style.clipPath=below>0?`inset(0 0 ${below.toFixed(1)}px 0)`:'';
        l.el.style.transform=t>=1?'none':`translate(${(x-l.x)/st}px,${y-l.y}px) rotate(${rot}deg)`;
        return;
      }
      l.el.style.clipPath='';
      const x0=br-bl>l.w?clamp(l.x,bl+l.w/2,br-l.w/2):(bl+br)/2, y0=rimY+l.h*(1+l.lift);
      const ey=1-Math.pow(1-t,3);
      const ex=clamp((t-.3)/.7), exs=ex*ex*(3-2*ex);
      const fade=1-t;
      const x=x0+(l.x-x0)*exs + fade*Math.sin(t*5+l.phase)*l.h*.18*l.side;
      const y=y0+(l.y-y0)*ey;
      const rot=fade*l.spin*Math.sin(t*3.2+l.phase);
      l.el.style.transform=t>=1?'none':`translate(${(x-l.x)/st}px,${y-l.y}px) rotate(${rot}deg)`;
    });
  }
  frame.key=0;
  const nudge=d=>{ if(arranging) return; goal=clamp(goal+d); frame.force=true };
  home.addEventListener('wheel',e=>{ e.preventDefault(); nudge((e.deltaMode===1?e.deltaY*16:e.deltaY)/700) },{passive:false});
  let ty=null;
  home.addEventListener('touchstart',e=>{ ty=e.touches[0].clientY },{passive:true});
  home.addEventListener('touchmove',e=>{ if(drag||ty===null) return; const y=e.touches[0].clientY; nudge((ty-y)/420); ty=y },{passive:true});
  document.addEventListener('keydown',e=>{
    if(editing||e.target.closest('input,textarea,select,[contenteditable]')) return;
    const m={ArrowDown:.2,PageDown:.5,' ':.5,ArrowUp:-.2,PageUp:-.5}[e.key];
    if(m!==undefined){ e.preventDefault(); nudge(m) } else if(e.key==='End') nudge(1); else if(e.key==='Home') nudge(-1);
  });
  addEventListener('resize',()=>{ dirty=true; frame.force=true });
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ dirty=true; frame.force=true });
  split(); frame.force=true; requestAnimationFrame(frame);

  /* ---------- arrange: drag the words to their resting spots, then export ---------- */
  var arranging=false;
  const moveBtn=document.getElementById('moveToggle'), expBtn=document.getElementById('exportPos'), expOut=document.getElementById('exportOut');
  function setArrange(on){
    arranging=on&&!editing; document.body.classList.toggle('arranging',arranging);
    moveBtn.setAttribute('aria-pressed',arranging); expBtn.hidden=!arranging; if(!arranging) expOut.hidden=true;
    if(arranging){ goal=1; P=.999; frame.force=true }               // everything out of the bag while you place it
  }
  moveBtn.addEventListener('click',()=>{ if(!land()){ moveBtn.title='Turn the screen sideways to move words'; return } setArrange(!arranging) });
  let held=null;
  document.querySelectorAll('.menu li').forEach((li,i)=>{
    const a=li.querySelector('a');
    a.addEventListener('pointerdown',e=>{
      if(!arranging||!land()) return;
      e.preventDefault(); e.stopPropagation(); a.setPointerCapture(e.pointerId); a.classList.add('held');
      const w=S.words[i]; held={i,li,a,x:e.clientX,y:e.clientY,wx:w[0],wy:w[1]};
    });
    a.addEventListener('pointermove',e=>{
      if(!held||held.i!==i) return;
      const wx=+(held.wx+(e.clientX-held.x)/innerWidth*100).toFixed(1), wy=+(held.wy+(e.clientY-held.y)/innerHeight*100).toFixed(1);
      S.words[i]=[wx,wy]; li.style.setProperty('--wx',wx); li.style.setProperty('--wy',wy);
    });
    const drop=()=>{ if(!held||held.i!==i) return; a.classList.remove('held'); held=null; suppress=true; apply(); syncPanel() };
    a.addEventListener('pointerup',drop); a.addEventListener('pointercancel',drop);
  });
  function positions(){
    const names=links.map(a=>a.dataset.raw||a.textContent);
    return '/* word resting spots, landscape: % of window from left, % from top (word centre) */\n'+
      S.words.map((w,i)=>`.menu li:nth-child(${i+1}){--wx:${w[0]};--wy:${w[1]}}   /* ${names[i]} */`).join('\n')+
      `\n/* window ${innerWidth}x${innerHeight}, offsets x ${S.menuX}vw y ${S.menuY}vh */`;
  }
  expBtn.addEventListener('click',()=>{
    const txt=positions(); expOut.value=txt; expOut.hidden=false;
    const sel=()=>{ expOut.focus(); expOut.select(); expBtn.textContent='Selected: copy it' };
    try{ navigator.clipboard.writeText(txt).then(()=>{ expBtn.textContent='Copied ✓'; setTimeout(()=>expBtn.textContent='Export positions',1800) },sel) }catch(err){ sel() }
  });

  /* ---------- menu on/off ---------- */
  const sw=document.getElementById('menuSwitch');
  const setMenu=on=>{ sw.setAttribute('aria-pressed',on); document.body.classList.toggle('menu-off',!on); set('menu',on?'1':'0') };
  setMenu(get('menu')!=='0');
  sw.addEventListener('click',()=>setMenu(sw.getAttribute('aria-pressed')!=='true'));

  /* ---------- edit toggle ---------- */
  const btn=document.getElementById('editToggle');
  btn.addEventListener('click',()=>{
    editing=!editing;
    document.body.classList.toggle('editing',editing); btn.setAttribute('aria-pressed',editing);
    if(editing){ setArrange(false); join() } else { split(); frame.force=true }
    texts.forEach(el=>{ if(editing){ el.contentEditable='plaintext-only'; if(el.contentEditable!=='plaintext-only') el.contentEditable='true'; } else el.removeAttribute('contenteditable'); });
  });

  /* ---------- dev panel ---------- */
  const dev=document.getElementById('dev'), devBtn=document.getElementById('devToggle');
  const SCHEMA=[
    ['Typeface',[
      {k:'font',label:'Family',type:'select',options:Object.keys(FONTS)},
      {k:'customFont',label:'Custom name',type:'text',placeholder:'e.g. Big Shoulders Display'},
      {k:'weight',label:'Weight',type:'range',min:100,max:1000,step:10},
      {k:'size',label:'Size ×',type:'range',min:.2,max:4,step:.01},
      {k:'stretch',label:'Widen ×',type:'range',min:.3,max:5,step:.01},
      {k:'fontStretch',label:'Font width %',type:'range',min:25,max:200,step:1,note:'variable-width fonts only'},
      {k:'tracking',label:'Tracking em',type:'range',min:-.3,max:1.5,step:.005},
      {k:'textCase',label:'Case',type:'select',options:['none','uppercase','lowercase','capitalize']},
      {k:'italic',label:'Italic',type:'check'},
      {k:'fvs',label:'Variation',type:'text',placeholder:'"wght" 300, "wdth" 150'},
      {k:'color',label:'Colour',type:'color'},
      {k:'hover',label:'Hover',type:'color'}
    ]],
    ['Menu layout',[
      {k:'pitch',label:'Spacing ×',type:'range',min:.3,max:3,step:.01},
      {k:'drift',label:'Drift px/line',type:'range',min:-60,max:60,step:.5},
      {k:'menuX',label:'X offset vw',type:'range',min:-70,max:30,step:.1},
      {k:'menuY',label:'Y offset vh',type:'range',min:-50,max:50,step:.1}
    ]],
    ['Bag',[
      {k:'objScale',label:'Scale ×',type:'range',min:.2,max:3,step:.01},
      {k:'objOpacity',label:'Opacity',type:'range',min:0,max:1,step:.01},
      {k:'objX',label:'X px',type:'range',min:-2000,max:2000,step:1},
      {k:'objY',label:'Y px',type:'range',min:-2000,max:2000,step:1},
      {type:'buttons',items:[['Centre position',()=>{S.objX=0;S.objY=0}],['Reset bag',()=>{['objScale','objOpacity','objX','objY'].forEach(k=>S[k]=DEFAULTS.layout[orient][k])}]]}
    ]],
    ['Background',[
      {k:'palette',label:'Palette',type:'palette'},
      {k:'bg',label:'Showing #',type:'range',min:0,max:4,step:1},
      {k:'cycle',label:'Cycle on click',type:'check'},
      {k:'fade',label:'Fade ms',type:'range',min:0,max:1500,step:10}
    ]],
    ['Export',[
      {type:'buttons',items:[['Copy CSS',()=>out(css())],['Copy JSON',()=>{push();const k=clone(S);LK.forEach(x=>delete k[x]);out(JSON.stringify(k,null,1))}],['Reset all',()=>{S=clone(DEFAULTS);pull()}]]},
      {type:'output'}
    ]]
  ];
  const controls=[];
  function build(){
    dev.innerHTML='<header><span id="dev-title"></span><button type="button" aria-label="Close panel">✕</button></header>';
    label();
    dev.querySelector('header button').onclick=()=>toggleDev(false);
    SCHEMA.forEach(([title,items],gi)=>{
      const d=document.createElement('details'); d.open=gi<3;
      d.innerHTML=`<summary>${title}</summary><div class="rows"></div>`; const rows=d.querySelector('.rows');
      items.forEach(it=>{
        const row=document.createElement('div'); row.className='row';
        if(it.type==='buttons'){ row.className='btns'; it.items.forEach(([t,fn])=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.onclick=()=>{fn();apply();syncPanel()};row.appendChild(b)}); rows.appendChild(row); return }
        if(it.type==='output'){ row.className=''; row.innerHTML='<textarea id="dev-out" readonly hidden></textarea><div class="note" id="dev-out-note"></div>'; rows.appendChild(row); return }
        const id='dev-'+it.k; row.innerHTML=`<label for="${id}">${it.label}</label>`;
        let el,num;
        if(it.type==='range'){
          el=Object.assign(document.createElement('input'),{type:'range',id,min:it.min,max:it.max,step:it.step});
          num=Object.assign(document.createElement('input'),{type:'number',id:id+'-n',step:it.step,'aria-label':it.label+' value'});
          const fire=v=>{ S[it.k]=parseFloat(v); if(Number.isNaN(S[it.k])) return; apply(); syncPanel(it.k) };
          el.oninput=()=>fire(el.value); num.oninput=()=>fire(num.value);
          row.append(el,num);
        } else if(it.type==='select'){
          row.className='row wide'; el=document.createElement('select'); el.id=id;
          it.options.forEach(o=>el.add(new Option(o,o))); el.onchange=()=>{S[it.k]=el.value;apply()}; row.append(el);
        } else if(it.type==='text'){
          row.className='row wide'; el=Object.assign(document.createElement('input'),{type:'text',id,placeholder:it.placeholder||'',spellcheck:false});
          el.onchange=()=>{S[it.k]=el.value;if(it.k==='customFont'&&el.value.trim())S.font='Custom (Google Fonts name)';apply();syncPanel()}; row.append(el);
        } else if(it.type==='check'){
          row.className='row wide'; el=Object.assign(document.createElement('input'),{type:'checkbox',id}); el.onchange=()=>{S[it.k]=el.checked;apply()}; row.append(el);
        } else if(it.type==='color'){
          row.className='row wide'; el=Object.assign(document.createElement('input'),{type:'color',id}); el.oninput=()=>{S[it.k]=el.value;apply()}; row.append(el);
        } else if(it.type==='palette'){
          row.className='row wide'; el=document.createElement('div'); el.className='swatches';
          S.palette.forEach((c,i)=>{const s=Object.assign(document.createElement('input'),{type:'color',id:id+'-'+i,'aria-label':'Palette colour '+(i+1)});
            s.oninput=()=>{S.palette[i]=s.value;apply()}; el.appendChild(s)}); row.append(el);
        }
        if(it.note){ const n=document.createElement('div'); n.className='note'; n.style.gridColumn='2 / -1'; n.textContent=it.note; row.append(n) }
        controls.push({it,el,num}); rows.appendChild(row);
      });
      dev.appendChild(d);
    });
  }
  function label(){ const el=document.getElementById('dev-title'); if(el) el.textContent='Dev · '+(orient==='port'?'vertical':'horizontal')+' layout' }
  function syncPanel(skip){
    if(dev.hidden) return;
    controls.forEach(({it,el,num})=>{
      const v=S[it.k];
      if(it.type==='range'){ if(it.k!==skip||document.activeElement!==el) el.value=v; if(document.activeElement!==num) num.value=v }
      else if(it.type==='check') el.checked=!!v;
      else if(it.type==='palette') [...el.children].forEach((s,i)=>s.value=S.palette[i]);
      else if(document.activeElement!==el) el.value=v;
    });
  }
  function css(){
    push(); const t=tokens(); delete t['--field'];
    const lay=o=>{ const L=S.layout[o]; return `  --type-scale:${L.size}; --pitch-scale:${L.pitch}; --drift:${L.drift}px; --menu-dx:${L.menuX}vw; --menu-dy:${L.menuY}vh;\n  --object-scale:${L.objScale}; --object-opacity:${L.objOpacity}; /* bag offset ${L.objX}px ${L.objY}px */` };
    ['--type-scale','--pitch-scale','--drift','--menu-dx','--menu-dy','--object-scale','--object-opacity'].forEach(k=>delete t[k]);
    return `:root{\n${Object.entries(t).map(([k,v])=>`  ${k}:${v};`).join('\n')}\n  --palette:${S.palette.join(' ')};\n}\n/* horizontal */\n:root{\n${lay('land')}\n}\n/* vertical */\n@media (orientation:portrait){:root{\n${lay('port')}\n}}`;
  }
  function out(text){
    const ta=document.getElementById('dev-out'), note=document.getElementById('dev-out-note');
    ta.value=text; ta.hidden=false;
    const fallback=()=>{ ta.focus(); ta.select(); note.textContent='Selected. Copy it manually.' };
    try{ navigator.clipboard.writeText(text).then(()=>note.textContent='Copied to clipboard.',fallback) }catch(e){ fallback() }
  }
  function toggleDev(on){
    on=on===undefined?dev.hidden:on;
    if(on&&!dev.children.length) build();
    dev.hidden=!on; devBtn.setAttribute('aria-pressed',on); if(on) syncPanel();
  }
  devBtn.addEventListener('click',()=>toggleDev());
  document.addEventListener('keydown',e=>{
    if(e.key==='`' && !e.target.closest('input,textarea,select,[contenteditable]')){ e.preventDefault(); toggleDev() }
  });
})();
</script>
