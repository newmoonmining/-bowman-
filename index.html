:root{
  --vh:100vh;

html,body{height:100%}

.home{position:fixed;inset:0;background:var(--field);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}

/* bag: transparent cut-out, the image never catches clicks */
.bag{position:absolute;overflow:hidden;z-index:2;pointer-events:none}
.bag img{width:100%;height:100%;object-fit:contain;object-position:left top;display:block;-webkit-user-drag:none}

/* words: each letter is its own span so it can be thrown in and flown out */

.menu{position:absolute;margin:0;padding:0;list-style:none;display:flex;align-items:center}
.menu li{display:flex;align-items:center}
.menu a{display:inline-block;white-space:nowrap;pointer-events:auto;color:var(--text);text-decoration:none;line-height:1;padding:.1em .15em;
  font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;font-size:calc(var(--menu-size)*var(--type-scale));font-weight:420;
  font-stretch:25%;letter-spacing:-.04em;transform:scaleX(2.32);transform-origin:center}
.menu a:hover,.menu a:focus-visible{outline:none;color:var(--hover)}

/* the note that missed the bag: lies beside it, links to SoundCloud */
.miss{position:absolute;left:0;top:0;z-index:4;display:block;width:calc(var(--menu-size)*1.5);color:var(--text);will-change:transform}
.miss:hover,.miss:focus-visible{color:var(--hover);outline:none}
.miss-sym{display:block;width:100%;height:auto;overflow:visible}

<script>
(function(){
  const home=document.querySelector('.home'), bag=document.querySelector('.bag'), bagImg=bag.querySelector('img');
  const miss=document.querySelector('.miss'), links=[...document.querySelectorAll('.menu a')];
  const portrait=matchMedia('(orientation: portrait)'), land=()=>!portrait.matches, orient=()=>land()?'land':'port';
  const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  const bez=(a,b,c,d,u)=>{const v=1-u;return v*v*v*a+3*v*v*u*b+3*v*u*u*c+u*u*u*d};
  const rotv=(x,y,a)=>[x*Math.cos(a)-y*Math.sin(a), x*Math.sin(a)+y*Math.cos(a)];

  /* ---------- motion: every timing and feel knob, one set per orientation ---------- */
  const MOTION={
    land:{ dur:[.34,.5], spin:[220,620], fast:1.1, rush:.8, rushWin:.5, gap:.55, bounces:3, bounceH:[.03,.12],
           kick:1, missAt:[.32,.5], lift:[.07,.13], wheel:700, swipe:420 },
    port:{ dur:[.34,.5], spin:[220,620], fast:1.1, rush:.8, rushWin:.5, gap:.55, bounces:3, bounceH:[.03,.12],
           kick:.7, missAt:[.32,.5], lift:[.03,.07], wheel:700, swipe:420 }
  };
  const M=()=>MOTION[orient()];
  const RIM=.655, BODY_L=.20, BODY_R=.76, MOUTH_R=.6;   // bag opening and body edges, as fractions of the image
  const FLY=.8;                                          // share of a scroll-out spent in the air; the rest is the settle

  /* ---------- background: click to step through the palette (each orientation keeps its own) ---------- */
  const PALETTE=['#ffffff','#c1bcac','#8dfc91','#c9b9ff','#ffa175'], bgi={land:3,port:3};
  const paint=()=>document.documentElement.style.setProperty('--field',PALETTE[bgi[orient()]]);
  home.addEventListener('click',e=>{ if(e.target.closest('a')) return; bgi[orient()]=(bgi[orient()]+1)%PALETTE.length; paint() });
  home.addEventListener('contextmenu',e=>e.preventDefault());
  links.forEach(a=>a.addEventListener('click',e=>e.preventDefault()));   // word destinations still to come

  /* ---------- letters: split each word into spans, measure where each one rests ---------- */
  let L=[], P=0, goal=0, last=0, dirty=true, key=0, force=true;
  links.forEach(a=>{ const t=a.textContent; a.textContent='';
    [...t].forEach(c=>{ const s=document.createElement('span'); s.className='ch'; s.textContent=c; a.appendChild(s); L.push({el:s, start:rnd(0,.38)}) }) });

  function measure(){                              // resting slot, plus how each letter's own frame is turned, scaled and stretched
    L.forEach(l=>{ l.el.style.transform='none'; l.el.style.clipPath='' });
    L.forEach(l=>{ const r=l.el.getBoundingClientRect(); l.x=r.left+r.width/2; l.y=r.top+r.height/2; l.h=r.height; l.w=r.width;
      l.w0=l.el.offsetWidth; l.h0=l.el.offsetHeight;
      const probe=(tx,ty)=>{ l.el.style.transform=`translate(${tx}px,${ty}px)`; const q=l.el.getBoundingClientRect(); return [(q.left+q.width/2-l.x)/100,(q.top+q.height/2-l.y)/100] };
      const [a,c]=probe(100,0), [b,d]=probe(0,100), det=a*d-b*c||1;
      l.Mi=[d/det,-b/det,-c/det,a/det]; l.el.style.transform='none' });
    missRest(); if(INTRO.done) missAt(MISS.x,MISS.y,MISS.side*-9);
    dirty=false; key++;
  }
  const toLocal=(l,dx,dy)=>[l.Mi[0]*dx+l.Mi[1]*dy, l.Mi[2]*dx+l.Mi[3]*dy];
  function place(l,x,y,rot,sc,clipRim){            // put a letter at screen x,y; optionally hide whatever is below the rim
    const [lx,ly]=toLocal(l,x-l.x,y-l.y), rr=-rot*Math.PI/180;
    if(clipRim!==null){
      const big=4*Math.max(innerWidth,innerHeight), cx=l.w0/2, cy=l.h0/2;
      const pts=[[x-big,clipRim],[x+big,clipRim],[x+big,clipRim-big],[x-big,clipRim-big]].map(([qx,qy])=>{
        const [px,py]=rotv(...toLocal(l,qx-x,qy-y),rr); return `${(cx+px/sc).toFixed(1)}px ${(cy+py/sc).toFixed(1)}px` });
      l.el.style.clipPath=`polygon(${pts.join(',')})`;
    } else l.el.style.clipPath='';
    l.el.style.transform=`translate(${lx}px,${ly}px) rotate(${rot}deg) scale(${sc})`;
  }
  function arc(l,b,rimY){                          // scroll-out path: straight across, gravity up and down, peak always clears the rim
    const side=clamp((l.x-(b.left+b.width/2))/(b.width/2),-1,1);
    const x0=b.left+b.width*(.5+side*(MOUTH_R-.5)*rnd(.3,1)), y0=rimY+l.h*.5;
    const top=Math.min(y0,l.y,rimY-l.h*.55)-innerHeight*rnd(...M().lift);
    const H=y0-top, D=l.y-y0, r=Math.sqrt(H*(H+D)), B=-2*(H+r), C=D-B;
    l.A={x0, y0, B, C, apex:H/(r+H), spin:(l.x>=x0?1:-1)*rnd(22,48), pop:rnd(.75,.88), key};
  }

  /* ---------- the bag flinches when something hits it ---------- */
  const jolt={y:0,v:0,r:0,rv:0,on:false};
  const kick=(f,side)=>{ jolt.v+=f*9; jolt.rv+=f*side*5; jolt.on=true };
  function shake(dt){
    if(!jolt.on) return;
    jolt.v+=(-260*jolt.y-14*jolt.v)*dt; jolt.y+=jolt.v*dt; jolt.rv+=(-260*jolt.r-14*jolt.rv)*dt; jolt.r+=jolt.rv*dt;
    if(Math.abs(jolt.y)+Math.abs(jolt.v)+Math.abs(jolt.r)+Math.abs(jolt.rv)<.002){ jolt.on=false; bagImg.style.transform=''; return }
    bagImg.style.transformOrigin='50% 100%';
    bagImg.style.transform=`translateY(${(jolt.y*innerHeight*.012).toFixed(2)}px) rotate(${(jolt.r*.9).toFixed(3)}deg) scaleY(${(1-jolt.y*.012).toFixed(4)})`;
  }

  /* ---------- the note that missed: clips the bag's flank, bounces twice, lies beside it ---------- */
  const MISS={};
  function missRest(){
    miss.style.transform='none';
    const b=bag.getBoundingClientRect(), s=miss.offsetWidth, side=land()?-1:1;
    const floor=Math.min(b.bottom-b.height*.02, innerHeight-(land()?72:16));
    const cx=clamp(b.left+b.width*(side>0?BODY_R:BODY_L)+side*s*1.7, s*.7, innerWidth-s*.7);
    miss.style.left=(cx-s/2)+'px'; miss.style.top=(floor-s)+'px';
    const r=miss.getBoundingClientRect(); MISS.x=r.left+r.width/2; MISS.y=r.top+r.height/2; MISS.s=s;
    MISS.side=MISS.x>b.left+b.width*.48?1:-1;                                  // hits the flank facing where it ends up
    MISS.hx=b.left+b.width*(MISS.side>0?BODY_R:BODY_L)+MISS.side*s*.15; MISS.hy=floor-(floor-(b.top+b.height*RIM))*.5;
    const probe=(tx,ty)=>{ miss.style.transform=`translate(${tx}px,${ty}px)`; const q=miss.getBoundingClientRect(); return [(q.left+q.width/2-MISS.x)/100,(q.top+q.height/2-MISS.y)/100] };
    const [p,c]=probe(100,0), [q,d]=probe(0,100), det=p*d-q*c||1; MISS.Mi=[d/det,-q/det,-c/det,p/det];
    miss.style.transform='none';
  }
  function missAt(x,y,rot){ const N=MISS.Mi, dx=x-MISS.x, dy=y-MISS.y;
    miss.style.transform=`translate(${N[0]*dx+N[1]*dy}px,${N[2]*dx+N[3]*dy}px) rotate(${rot}deg)` }
  function missFrame(t){                           // t: seconds since its throw. true while moving
    const s=MISS.s, side=MISS.side, sx=side>0?innerWidth+s:-s, sy=innerHeight*(land()?.12:.42);
    const d1=.4, d2=.42, d3=.2, x2=MISS.x-side*s*.35, rest=side*-9;
    const rot=rest-side*900*Math.pow(1-clamp(t/(d1+d2+d3)),2.2);
    if(t<0){ missAt(sx,sy,rot); return true }
    if(t<d1){ const u=t/d1*(.8+.2*t/d1); missAt(sx+(MISS.hx-sx)*u, sy+(MISS.hy-sy)*u-innerHeight*.05*4*u*(1-u), rot); return true }
    if(!MISS.hit){ MISS.hit=true; kick(.8,-side) }
    if(t<d1+d2){ const v=(t-d1)/d2; missAt(MISS.hx+(x2-MISS.hx)*v, MISS.hy+(MISS.y-MISS.hy)*v-innerHeight*.09*4*v*(1-v), rot); return true }
    if(t<d1+d2+d3){ const v=(t-d1-d2)/d3; missAt(x2+(MISS.x-x2)*v, MISS.y-s*.22*4*v*(1-v), rot); return true }
    missAt(MISS.x,MISS.y,rest); return false;
  }

  /* ---------- load-in: letters thrown into the bag (80% inside the first second), a few bounce back out ---------- */
  const INTRO={t0:null, done:matchMedia('(prefers-reduced-motion: reduce)').matches};
  if(!INTRO.done) document.documentElement.classList.add('intro-wait');
  function plan(){
    const m=M(), order=L.map((l,i)=>i).sort(()=>Math.random()-.5), k=Math.ceil(order.length*m.rush);
    L.forEach(l=>{ const r=Math.random(), from=r<.5?'top':r<.75?'left':'right';
      l.I={from, f:from==='top'?rnd(.04,.9):rnd(.08,.5), dur:rnd(...m.dur), spin:(Math.random()<.5?-1:1)*rnd(...m.spin),
           bow:rnd(.1,.22), side:Math.random()<.5?-1:1, hit:rnd(.6,1)} });
    order.forEach((n,i)=>{ const I=L[n].I; if(i%2) I.dur/=m.fast;            // every other one thrown faster
      I.delay=i<k ? Math.min(.04+i*(m.rushWin/Math.max(1,k-1))+rnd(-.02,.02), .98-I.dur) : 1+(i-k+1)*m.gap+rnd(-.05,.05) });
    INTRO.missAt=rnd(...m.missAt);                                             // the note goes in with the rush
    order.slice(0,k).sort(()=>Math.random()-.5).slice(0,m.bounces).forEach(n=>Object.assign(L[n].I,
      {bounce:true, bwait:rnd(.02,.12), bd:rnd(.42,.62), bhf:rnd(...m.bounceH), bx:rnd(-1.2,1.2), bs:rnd(-40,40)}));
  }
  function intro(T,rimY,isLand){                   // true while anything is still moving
    let busy=false;
    L.forEach(l=>{
      const I=l.I, A=l.A, f=clamp((T-I.delay)/I.dur); if(f<1) busy=true;
      const sx=I.from==='top'?innerWidth*I.f:I.from==='left'?-l.w:innerWidth+l.w, sy=I.from==='top'?-l.h:innerHeight*I.f;
      const ex=A.x0, ey=A.y0;                                                  // lands where its scroll-out starts
      const c1x=sx+(ex-sx)*(.33+I.bow), c1y=sy+(ey-sy)*.2, c2x=ex+(sx-ex)*.12, c2y=ey-(ey-sy)*.3;
      const u=f*(.75+.25*f), x=bez(sx,c1x,c2x,ex,u), y=bez(sy,c1y,c2y,ey,u);
      if(f>=1&&!I.landed){ I.landed=true; kick(I.hit*M().kick, I.side) }
      if(f>=1&&I.bounce){                                                      // pops back up out of the mouth, drops in again
        const tb=T-I.delay-I.dur-I.bwait;
        if(tb<I.bd){ busy=true;
          if(tb>0){ const v=tb/I.bd, by=ey-(ey-(rimY-l.h*.6)+innerHeight*I.bhf)*4*v*(1-v);
            place(l, ex+I.bx*l.w*Math.sin(Math.PI*v), by, A.spin+I.bs*Math.sin(Math.PI*v), A.pop, isLand&&by+l.h>rimY?rimY:null); return } }
        else if(!I.landed2){ I.landed2=true; kick(.45*I.hit, -I.side) }
      }
      place(l,x,y,I.spin*(1-u)+A.spin*u,1-(1-A.pop)*u*u,isLand&&y+l.h>rimY?rimY:null);
    });
    return missFrame(T-INTRO.missAt)||busy;
  }

  /* ---------- every frame: load-in first, then scroll moves the letters out of the bag and back ---------- */
  function frame(now){
    requestAnimationFrame(frame);
    const dt=Math.min(.05,(now-last)/1000||0); last=now;
    if(dirty) measure();
    const b=bag.getBoundingClientRect(), rimY=b.top+b.height*RIM, isLand=land();
    L.forEach(l=>{ if(!l.A||l.A.key!==key) arc(l,b,rimY) });
    if(!INTRO.done){
      if(INTRO.t0===null){ INTRO.t0=now; plan() }
      const busy=intro((now-INTRO.t0)/1000,rimY,isLand);
      document.documentElement.classList.remove('intro-wait');
      if(busy||jolt.on){ shake(dt); return }
      INTRO.done=true; force=true;
    }
    const moved=Math.abs(goal-P)>.0005;
    P+=(goal-P)*(1-Math.exp(-dt*7)); if(!moved&&!force) return; force=false;
    L.forEach(l=>{
      const t=clamp((P-l.start)/.62);
      if(t>=1){ l.el.style.transform='none'; l.el.style.clipPath=''; return }
      const A=l.A, u=1-Math.pow(1-clamp(t/FLY),1.35);                         // fast launch, gravity does the slowing
      let y=A.y0+A.B*u+A.C*u*u; if(t>FLY){ const s=(t-FLY)/(1-FLY); y+=l.h*.07*Math.sin(s*Math.PI)*(1-s) }   // lands, dips, settles
      place(l, A.x0+(l.x-A.x0)*u, y, A.spin*Math.pow(1-u,1.6), A.pop+(1-A.pop)*clamp(u/.35)**.6, isLand&&u<A.apex?rimY:null);
    });
  }

  /* ---------- input: wheel, swipe and keys drive the scroll-out ---------- */
  const nudge=d=>{ goal=clamp(goal+d); force=true };
  home.addEventListener('wheel',e=>{ e.preventDefault(); nudge((e.deltaMode===1?e.deltaY*16:e.deltaY)/M().wheel) },{passive:false});
  let ty=null;
  home.addEventListener('touchstart',e=>{ ty=e.touches[0].clientY },{passive:true});
  home.addEventListener('touchmove',e=>{ const y=e.touches[0].clientY; nudge((ty-y)/M().swipe); ty=y },{passive:true});
  document.addEventListener('keydown',e=>{
    const m={ArrowDown:.2,PageDown:.5,' ':.5,ArrowUp:-.2,PageUp:-.5}[e.key];
    if(m!==undefined){ e.preventDefault(); nudge(m) } else if(e.key==='End') nudge(1); else if(e.key==='Home') nudge(-1);
  });
  const relayout=()=>{ dirty=true; force=true };
  addEventListener('resize',relayout); portrait.addEventListener('change',()=>{ paint(); relayout() });
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(relayout);
  paint(); requestAnimationFrame(frame);
})();
</script>
