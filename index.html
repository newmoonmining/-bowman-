    b.innerHTML=`<header><span>${esc(n)}</span><button type="button" aria-label="Close">✕</button></header>`+

      `<button type="button" class="dt-reset">reset ${esc(n)}</button>`;
    document.body.appendChild(b); boxes[n]=b; el.classList.add('dt-sel');

    b.querySelectorAll('input').forEach(i=>{
      i.addEventListener('input',()=>{ const v=parseFloat(i.value); if(isNaN(v)) return; if(!g){ rememberAsset(n); g=true } setv(n,{[i.dataset.k]:v}) });

    const r=rect(el), n0=Object.keys(boxes).length-1;
    place(b, r.right+12>innerWidth-240?r.left-242:r.right+12, Math.max(8,r.top)+n0*16);

  function place(b,x,y){ b.style.left=Math.max(8,Math.min(innerWidth-b.offsetWidth-8,x))+'px'; b.style.top=Math.max(8,Math.min(innerHeight-b.offsetHeight-8,y))+'px' }
  function close(n){ if(boxes[n]){ boxes[n].remove(); delete boxes[n] } assets().filter(a=>a.dataset.asset===n).forEach(a=>a.classList.remove('dt-sel')); frames() }
  function syncBox(n){ const b=boxes[n]; if(!b) return; const v=val(n);

        else if(c.type==='check'){ el=Object.assign(document.createElement('input'),{type:'checkbox'}); el.addEventListener('change',()=>{ fire(el.checked); end() }) }
        else if(c.type==='color'){ el=Object.assign(document.createElement('input'),{type:'color'}); el.addEventListener('input',()=>fire(el.value)); el.addEventListener('change',end) }
        else if(c.type==='colors'){ el=document.createElement('div'); el.className='dt-sw';

            s.addEventListener('input',()=>{ const a=[...p.get()[c.k]]; a[j]=s.value; fire(a) }); s.addEventListener('change',end); el.appendChild(s) }) }
        else { el=Object.assign(document.createElement('input'),{type:'text',placeholder:c.placeholder||'',spellcheck:false}); el.addEventListener('change',()=>{ fire(el.value); end() }) }
        el.id=id; el.dataset.k=c.k; row.append(el);
      }

    });
    const rs=document.createElement('button'); rs.type='button'; rs.className='dt-reset'; rs.textContent='reset '+(p.title||p.name);
    rs.onclick=()=>{ if(!p.reset) return; rememberPanel(p); p.reset(); syncPanel(p) }; if(p.reset) b.appendChild(rs);

  function closePanel(i){ if(pboxes[i]){ pboxes[i].remove(); delete pboxes[i] } const b=bar.querySelector(`.dt-pb[data-i="${i}"]`); if(b) b.setAttribute('aria-pressed','false') }
  function syncPanel(p,skip){ const i=opts.panels.indexOf(p), b=pboxes[i]; if(!b) return; const v=p.get();
    b.querySelectorAll('[data-k]').forEach(el=>{ const k=el.dataset.k; if(document.activeElement===el) return;
      if(el.type==='checkbox') el.checked=!!v[k];
      else if(el.classList.contains('dt-sw')) [...el.children].forEach((s,j)=>{ if(document.activeElement!==s) s.value=(v[k]||[])[j] });
      else el.value=v[k] }) }

  /* frames with corner handles on open assets */
  const fr={};
  function frames(){
    Object.keys(fr).forEach(n=>{ if(!boxes[n]){ fr[n].remove(); delete fr[n] } });
    Object.keys(boxes).forEach(n=>{
      const el=assets().find(a=>a.dataset.asset===n); if(!el) return;
      let f=fr[n];

        f.innerHTML=['nw','ne','sw','se'].map(c=>`<span class="dt-h" data-c="${c}"></span>`).join(''); document.body.appendChild(f);
        f.querySelectorAll('.dt-h').forEach(h=>grab(h,(dx,dy,s,e)=>{
          const d=Math.hypot(e.clientX-s.cx,e.clientY-s.cy); setv(n,{s:+Math.max(.05,s.s*d/s.d).toFixed(3)}) },
          e=>{ rememberAsset(n); const r=rect(el), cx=r.left+r.width/2, cy=r.top+r.height/2; return {cx,cy,s:val(n).s,d:Math.max(1,Math.hypot(e.clientX-cx,e.clientY-cy))} })) }
      const r=rect(el); Object.assign(f.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
    });
  }
  addEventListener('resize',frames); addEventListener('scroll',frames,true);
  (function tick(){ if(on&&Object.keys(boxes).length) frames(); requestAnimationFrame(tick) })();   // follow assets that animate

  /* drag helper: fn(dx,dy,startState,event) */
  function grab(h,fn,start){
    h.addEventListener('pointerdown',e=>{ if(e.button>0) return; e.preventDefault(); e.stopPropagation(); h.setPointerCapture(e.pointerId);
      const s=start(e), x=e.clientX, y=e.clientY;

      h.addEventListener('pointermove',mv); h.addEventListener('pointerup',up); h.addEventListener('pointercancel',up) });
  }

  let press=null;
  const live=()=>on&&!paused;
  document.addEventListener('pointerdown',e=>{
    if(!live()||e.button>0) return; const el=e.target.closest('[data-asset]'); if(!el||e.target.closest('.dt-box,.dt-bar,.dt-frame')) return;
    e.preventDefault(); e.stopPropagation(); const v=val(el.dataset.asset);
    press={el,n:el.dataset.asset,x:e.clientX,y:e.clientY,vx:v.x,vy:v.y,moved:false};
  },true);
  document.addEventListener('pointermove',e=>{ if(!press) return; e.stopPropagation();
    const dx=e.clientX-press.x, dy=e.clientY-press.y; if(!press.moved&&Math.abs(dx)+Math.abs(dy)>4){ press.moved=true; rememberAsset(press.n) }
    if(press.moved) setv(press.n,{x:+(press.vx+dx/innerWidth*100).toFixed(2),y:+(press.vy+dy/innerHeight*100).toFixed(2)}) },true);
  document.addEventListener('pointerup',e=>{ if(!press) return; e.stopPropagation(); const p=press; press=null;
    if(!p.moved){ boxes[p.n]?close(p.n):open(p.el) } },true);
  ['click','dblclick','contextmenu','wheel'].forEach(t=>document.addEventListener(t,e=>{ if(live()&&e.target.closest&&e.target.closest('[data-asset]')){ e.preventDefault(); e.stopPropagation() } },{capture:true,passive:false}));
  document.addEventListener('keydown',e=>{
    if(!on||e.target.closest('input,textarea,select,[contenteditable]')) return;
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); return }
    if(paused) return;
    if(e.key==='Escape'){ Object.keys(boxes).length?Object.keys(boxes).forEach(close):lock(); return }
    const m={ArrowLeft:['x',-.5],ArrowRight:['x',.5],ArrowUp:['y',-.5],ArrowDown:['y',.5]}[e.key]; if(!m||!Object.keys(boxes).length) return;
    e.preventDefault(); Object.keys(boxes).forEach(n=>{ rememberAsset(n); setv(n,{[m[0]]:+(val(n)[m[0]]+m[1]*(e.shiftKey?10:1)).toFixed(2)}) });
  },true);

  /* export: CSS to paste into the page + JSON to hand back to da tools as defaults */
  function exportText(){
    const names=[...new Set(assets().map(a=>a.dataset.asset))];
    const css=names.map(n=>{ const v=val(n), p=[];
      if(v.x||v.y) p.push(`translate:${v.x}vw ${v.y}vh`); if(v.s!==1) p.push(`scale:${v.s}`); if(v.r) p.push(`rotate:${v.r}deg`);
      if(v.o!==1) p.push(`opacity:${v.o}`); if(v.z!=='') p.push(`z-index:${v.z}`);
      return p.length?`[data-asset="${n}"]{${p.join(';')}}`:''; }).filter(Boolean).join('\n')||'/* nothing moved yet */';
    const json=JSON.stringify(Object.fromEntries(names.map(n=>[n,val(n)])));
    const seen=JSON.stringify(Object.fromEntries(names.map(n=>{ const el=assets().find(x=>x.dataset.asset===n), r=rect(el);   // where it really sits on screen
      return [n,{cx:+((r.left+r.width/2)/innerWidth*100).toFixed(2),cy:+((r.top+r.height/2)/innerHeight*100).toFixed(2),w:+(r.width/innerWidth*100).toFixed(2)}] })));
    const pan=opts.panels.map(p=>`\n/* ${p.name}: ${JSON.stringify(p.get())} */`).join('');
    return `/* da tools export · ${innerWidth}x${innerHeight} · ${new Date().toISOString().slice(0,16)} */\n${css}\n/* defaults: ${json} */\n/* seen (centre % of window, width %): ${seen} */${pan}`;
  }
  expB.addEventListener('click',()=>{
    const t=exportText(); if(!out){ out=document.createElement('textarea'); out.className='dt-out'; out.readOnly=true; out.setAttribute('aria-label','da tools export'); document.body.appendChild(out) }
    out.value=t; out.hidden=false;
    const sel=()=>{ out.focus(); out.select(); expB.textContent='selected: copy it' };
    try{ navigator.clipboard.writeText(t).then(()=>{ expB.textContent='copied ✓'; setTimeout(()=>expB.textContent='export',1800) },sel) }catch(e){ sel() }
  });

  /* rekey: switch to another saved layout (e.g. portrait vs landscape) without mixing the two */
  function rekey(key,defaults){
    Object.keys(boxes).forEach(close); hist.length=0; undoB.disabled=true;
    K='datools:'+key; opts.key=key; opts.defaults=defaults||{};
    st=Object.assign({},opts.defaults,store.get(':assets')||{});
    assets().forEach(el=>{ ['translate','scale','rotate','opacity','zIndex'].forEach(k=>el.style[k]=''); paint(el) });
    Object.keys(pboxes).forEach(i=>{ const p=opts.panels[i]; closePanel(i); openPanel(+i) });   // panels re-read the other look
    if(opts.onChange) opts.onChange(null,null);
  }

  return { isOn:()=>on, lock, pause, undo, rekey, export:exportText, set:setv, get:val };
}
window.DaTools={init,version:'2.1'};
})();

<script>

  const links=[...document.querySelectorAll('.menu a')];

        L.push({el:s, sym:true, start:rnd(0,.38)}); return }
      const txt=a.textContent; a.dataset.raw=txt; a.textContent='';
      [...txt].forEach(c=>{ const s=document.createElement('span'); s.className='ch'; s.textContent=c; a.appendChild(s);

  }
  function join(){ links.forEach(a=>{ if(a.dataset.html!==undefined) a.innerHTML=a.dataset.html; else if(a.dataset.raw!==undefined) a.textContent=a.dataset.raw }); L=[] }
  function measure(){                                // each item's resting slot, plus how its own frame is turned and scaled
    L.forEach(l=>{ l.el.style.transform='none'; l.el.style.clipPath='' });
    L.forEach(l=>{ const r=l.el.getBoundingClientRect(); l.x=r.left+r.width/2; l.y=r.top+r.height/2; l.h=r.height; l.w=r.width;
      l.w0=l.el.offsetWidth; l.h0=l.el.offsetHeight;
      const probe=(tx,ty)=>{ l.el.style.transform=`translate(${tx}px,${ty}px)`; const q=l.el.getBoundingClientRect(); return [(q.left+q.width/2-l.x)/100,(q.top+q.height/2-l.y)/100] };
      const [a,c]=probe(100,0), [b,d]=probe(0,100), det=a*d-b*c||1;   // how a local step shows up on screen (stretch, scale, turn)
      l.M=[a,b,c,d]; l.Mi=[d/det,-b/det,-c/det,a/det];
      l.el.style.transform='none' });
    missRest(); if(INTRO.done&&miss) missAt(MISS.x,MISS.y,MISS.side*-9); if(INTRO.done) wrenchRest(); else W.x=undefined;
    dirty=false; frame.key++;
  }
  const MOUTH_L=.4, MOUTH_R=.6;                    // where items leave the opening (fractions of the image width)
  const land=()=>matchMedia('(orientation: landscape)').matches;
  const FLY=.8;                                    // share of the move spent in the air; the rest is the settle
  function arc(l,b,rimY,isLand){                   // a thrown object: straight line across, gravity curve up and down
    const side=clamp((l.x-(b.left+b.width/2))/(b.width/2),-1,1);
    const x0=b.left+b.width*(.5+side*(MOUTH_R-.5)*rnd(.3,1)), y0=rimY+l.h*.5;
    const top=Math.min(y0,l.y,rimY-l.h*.55)-innerHeight*rnd(...tune().lift);
    const H=y0-top, D=l.y-y0, r=Math.sqrt(H*(H+D)), B=-2*(H+r), C=D-B;
    l.A={x0, y0, B, C, apex:H/(r+H), spin:(l.x>=x0?1:-1)*rnd(22,48), pop:rnd(.75,.88)};
  }
  const bez=(a,b,c,d,u)=>{const v=1-u;return v*v*v*a+3*v*v*u*b+3*v*u*u*c+u*u*u*d};
  const rotv=(x,y,a)=>[x*Math.cos(a)-y*Math.sin(a), x*Math.sin(a)+y*Math.cos(a)];
  /* page-load intro: every letter drops in from the edges along a grass-blade curve and lands inside the bag */
  const INTRO={t0:null, done:matchMedia('(prefers-reduced-motion: reduce)').matches};
  function introPlan(l){                           // where it enters from (edges, as fractions) and when; kept across re-measures
    if(l.I) return l.I; const r=Math.random();
    const from=r<.5?'top':r<.75?'left':'right';
    const M=tune(); l.I={from, f:from==='top'?rnd(.04,.9):rnd(.08,.5), delay:0, dur:rnd(...M.dur),
         spin:(Math.random()<.5?-1:1)*rnd(...M.spin), bow:rnd(.1,.22), side:Math.random()<.5?-1:1, hit:rnd(.6,1)};
    return l.I;
  }
  const bagImg=obj.querySelector('img'), jolt={y:0,v:0,r:0,rv:0,on:false};   // the bag flinching under each hit
  function kick(f,side){ jolt.v+=f*9; jolt.rv+=f*side*5; jolt.on=true }
  function shake(dt){
    if(!jolt.on||!bagImg) return;
    jolt.v+=(-260*jolt.y-14*jolt.v)*dt; jolt.y+=jolt.v*dt; jolt.rv+=(-260*jolt.r-14*jolt.rv)*dt; jolt.r+=jolt.rv*dt;
    if(Math.abs(jolt.y)+Math.abs(jolt.v)+Math.abs(jolt.r)+Math.abs(jolt.rv)<.002){ jolt.on=false; bagImg.style.transform=''; return }
    bagImg.style.transformOrigin='50% 100%';
    bagImg.style.transform=`translateY(${(jolt.y*innerHeight*.012).toFixed(2)}px) rotate(${(jolt.r*.9).toFixed(3)}deg) scaleY(${(1-jolt.y*.012).toFixed(4)})`;
  }
  const miss=document.querySelector('.miss'), MISS={};
  function missRest(){                             // lies on the floor just beside the bag: right in portrait, left in landscape
    if(!miss) return; miss.style.transform='none';
    const b=obj.getBoundingClientRect(), s=miss.offsetWidth, side=land()?-1:1;
    const floor=Math.min(b.bottom-b.height*.02, innerHeight-(land()?72:16));
    const edge=b.left+b.width*(side>0?BODY_R:BODY_L);
    const cx=clamp(edge+side*s*1.7, s*.7, innerWidth-s*.7);
    miss.style.left=(cx-s/2)+'px'; miss.style.top=(floor-s)+'px';
    const r=miss.getBoundingClientRect(); MISS.x=r.left+r.width/2; MISS.y=r.top+r.height/2; MISS.s=s;
    MISS.side=MISS.x>b.left+b.width*.48?1:-1;                                  // moved in da tools? it clips the flank facing its resting spot
    const e2=b.left+b.width*(MISS.side>0?BODY_R:BODY_L);
    MISS.hx=e2+MISS.side*s*.15; MISS.hy=floor-(floor-(b.top+b.height*RIM))*.5;     // where it clips the bag's flank
    const probe=(tx,ty)=>{ miss.style.transform=`translate(${tx}px,${ty}px)`; const q=miss.getBoundingClientRect(); return [(q.left+q.width/2-MISS.x)/100,(q.top+q.height/2-MISS.y)/100] };
    const [p,c]=probe(100,0), [q,d]=probe(0,100), det=p*d-q*c||1; MISS.Mi=[d/det,-q/det,-c/det,p/det];
    miss.style.transform='none';
  }
  function missAt(x,y,rot){ const M=MISS.Mi, dx=x-MISS.x, dy=y-MISS.y;
    miss.style.transform=`translate(${M[0]*dx+M[1]*dy}px,${M[2]*dx+M[3]*dy}px) rotate(${rot}deg)` }
  function missFrame(T,start){                     // thrown last, clips the bag, bounces twice, lies still. true while moving
    if(!miss||MISS.x===undefined) return false;
    const s=MISS.s, side=MISS.side, sx=side>0?innerWidth+s:-s, sy=innerHeight*(land()?.12:.42);
    const d1=.4, d2=.42, d3=.2, t=T-start, x2=MISS.x-side*s*.35, rest=side*-9, spin=-side*900;
    const e=clamp(t/(d1+d2+d3)), rot=rest+spin*Math.pow(1-e,2.2);
    if(t<0){ missAt(sx,sy,rot); return true }
    if(t<d1){ const u=t/d1*(.8+.2*t/d1);
      missAt(sx+(MISS.hx-sx)*u, sy+(MISS.hy-sy)*u-innerHeight*.05*4*u*(1-u), rot); return true }
    if(!MISS.hit){ MISS.hit=true; kick(.8,-side) }
    if(t<d1+d2){ const v=(t-d1)/d2;
      missAt(MISS.hx+(x2-MISS.hx)*v, MISS.hy+(MISS.y-MISS.hy)*v-innerHeight*.09*4*v*(1-v), rot); return true }
    if(t<d1+d2+d3){ const v=(t-d1-d2)/d3;
      missAt(x2+(MISS.x-x2)*v, MISS.y-s*.22*4*v*(1-v), rot); return true }
    missAt(MISS.x,MISS.y,rest); return false;
  }
  const wrench=document.getElementById('wrench'), W={};
  function wrenchRest(){ if(!wrench) return; wrench.style.transform=''; wrench.style.clipPath='';
    const r=wrench.getBoundingClientRect(); W.x=r.left+r.width/2; W.y=r.top+r.height/2; W.w=r.width; W.h=r.height }
  function wrenchAt(x,y,rot,clipRim){              // fixed button: screen offsets are its own; hide what's under the rim if asked
    if(clipRim!==null){ const big=4*Math.max(innerWidth,innerHeight), rr=-rot*Math.PI/180;
      const pts=[[x-big,clipRim],[x+big,clipRim],[x+big,clipRim-big],[x-big,clipRim-big]].map(([qx,qy])=>{ const [px,py]=rotv(qx-x,qy-y,rr); return `${(W.w/2+px).toFixed(1)}px ${(W.h/2+py).toFixed(1)}px` });
      wrench.style.clipPath=`polygon(${pts.join(',')})` } else wrench.style.clipPath='';
    wrench.style.transform=`translate(${x-W.x}px,${y-W.y}px) rotate(${rot}deg)` }
  function wrenchFrame(T,b,rimY){                  // thrown in with the rush, rattles about inside, pops out to its corner. true while moving
    if(!wrench) return false; if(W.x===undefined) wrenchRest();
    const M=tune(), t0=M.wrenchIn, d1=.42, pop=M.wrenchPop, d2=.72, d3=.2, s=W.h;
    const mx=b.left+b.width*.47, my=rimY+s*.75, sx=innerWidth+s, sy=innerHeight*.12;
    if(T<t0){ wrenchAt(sx,sy,0,null); return true }
    if(T<t0+d1){ const u=(T-t0)/d1*(.75+.25*(T-t0)/d1);
      wrenchAt(sx+(mx-sx)*u, sy+(my-sy)*u-innerHeight*.06*4*u*(1-u), -560*u, u>.5?rimY:null); return true }
    if(!W.in){ W.in=true; kick(.9,1) }
    if(T<pop){ wrenchAt(mx,my,-560,rimY); return true }
    const top=Math.min(my,W.y,rimY-s)-innerHeight*.12, H=my-top, D=W.y-my, r=Math.sqrt(H*(H+D)), B=-2*(H+r), C=D-B, apex=H/(r+H);
    if(T<pop+d2){ const u=(T-pop)/d2;
      if(!W.out){ W.out=true; kick(.5,-1) }
      wrenchAt(mx+(W.x-mx)*u, my+B*u+C*u*u, -560+(560-720)*u, u<apex?rimY:null); return true }
    if(T<pop+d2+d3){ const v=(T-pop-d2)/d3; wrenchAt(W.x, W.y-s*.25*4*v*(1-v), -720+(720-720)*v, null); return true }
    wrenchAt(W.x,W.y,0,null); wrench.style.transform=''; return false;
  }
  function place(l,x,y,rot,sc,clipRim,toLocal){    // put one letter at screen x,y; optionally hide what's under the rim
    const [lx,ly]=toLocal(x-l.x,y-l.y), rr=-rot*Math.PI/180;
    if(clipRim!==null){
      const big=4*Math.max(innerWidth,innerHeight), cx=l.w0/2, cy=l.h0/2;
      const pts=[[x-big,clipRim],[x+big,clipRim],[x+big,clipRim-big],[x-big,clipRim-big]].map(([qx,qy])=>{
        const [px,py]=rotv(...toLocal(qx-x,qy-y),rr); return `${(cx+px/sc).toFixed(1)}px ${(cy+py/sc).toFixed(1)}px` });
      l.el.style.clipPath=`polygon(${pts.join(',')})`;
    } else l.el.style.clipPath='';
    l.el.style.transform=`translate(${lx}px,${ly}px) rotate(${rot}deg) scale(${sc})`;
  }
  function frame(now){
    requestAnimationFrame(frame);
    const dt=Math.min(.05,(now-last)/1000||0); last=now;
    if(editing||!L.length) return;
    if(dirty) measure();
    const b=obj.getBoundingClientRect(), rimY=b.top+b.height*RIM;
    const isLand=land();
    L.forEach(l=>{ if(!l.A||l.A.key!==frame.key) { arc(l,b,rimY,isLand); l.A.key=frame.key } });
    if(!INTRO.done){
      if(INTRO.t0===null){                                    // one at a time, in a random order, ~0.3s apart
        INTRO.t0=now;
        const order=L.map((l,i)=>i).sort(()=>Math.random()-.5);
        const M=tune(), k=Math.ceil(order.length*M.rush);   // most land inside the first second, the stragglers follow
        order.forEach((n,i)=>{ const I=introPlan(L[n]); if(i%2) I.dur/=M.fast;   // every other one thrown faster
          I.delay=i<k ? Math.min(.04+i*(M.rushWin/Math.max(1,k-1))+rnd(-.02,.02), .98-I.dur) : 1+(i-k+1)*M.gap+rnd(-.05,.05) });
        INTRO.missAt=rnd(...M.missAt);                     // the note goes in with the rush
        order.slice(0,k).sort(()=>Math.random()-.5).slice(0,M.bounces).forEach(n=>{ const I=L[n].I;   // a few bounce back out and drop in again
          Object.assign(I,{bounce:true, bwait:rnd(.02,.12), bd:rnd(.42,.62), bhf:rnd(...M.bounceH), bx:rnd(-1.2,1.2), bs:rnd(-40,40)}) });
      }
      const T=(now-INTRO.t0)/1000; let busy=false;
      L.forEach(l=>{
        const I=introPlan(l), A=l.A, Mi=l.Mi, toLocal=(dx,dy)=>[Mi[0]*dx+Mi[1]*dy, Mi[2]*dx+Mi[3]*dy];
        const f=clamp((T-I.delay)/I.dur); if(f<1) busy=true;
        const sx=I.from==='top'?innerWidth*I.f:I.from==='left'?-l.w:innerWidth+l.w;
        const sy=I.from==='top'?-l.h:innerHeight*I.f;
        const ex=A.x0, ey=A.y0;                                  // lands where the scroll-out starts: inside the mouth
        // blade shape: leaves the edge heading inward, then bends to drop straight down into the opening
        // a hard throw: nearly straight, just enough hook at the end to drop through the opening
        const c1x=sx+(ex-sx)*(.33+I.bow), c1y=sy+(ey-sy)*.2, c2x=ex+(sx-ex)*.12, c2y=ey-(ey-sy)*.3;
        const u=f*(.75+.25*f);                                   // leaves the hand fast and keeps coming
        const x=bez(sx,c1x,c2x,ex,u), y=bez(sy,c1y,c2y,ey,u);
        const rot=I.spin*(1-u)+A.spin*u, sc=1-(1-A.pop)*u*u;
        if(f>=1&&!I.landed){ I.landed=true; kick(I.hit*tune().kick, I.side) }   // smack: the bag takes the hit
        if(f>=1&&I.bounce){                                      // pops back up out of the mouth, falls in again
          const tb=T-I.delay-I.dur-I.bwait;
          if(tb<I.bd){ busy=true;
            if(tb>0){ const v=tb/I.bd, bh=ey-(rimY-l.h*.6)+innerHeight*I.bhf;
              place(l, ex+I.bx*l.w*Math.sin(Math.PI*v), ey-bh*4*v*(1-v), A.spin+I.bs*Math.sin(Math.PI*v), A.pop, isLand&&ey-bh*4*v*(1-v)+l.h>rimY?rimY:null, toLocal); return } }
          else if(!I.landed2){ I.landed2=true; kick(.45*I.hit, -I.side) }
        }
        place(l,x,y,rot,sc,isLand&&y+l.h>rimY?rimY:null,toLocal);
      });
      if(missFrame(T, INTRO.missAt)) busy=true;
      if(wrenchFrame(T,b,rimY)) busy=true;
      document.documentElement.classList.remove('intro-wait');
      if(busy||jolt.on) { shake(dt); return }
      INTRO.done=true; frame.force=true;
    }
    const k=1-Math.exp(-dt*7); const moved=Math.abs(goal-P)>.0005;
    P+=(goal-P)*k; if(!moved&&!frame.force) return; frame.force=false;
    L.forEach(l=>{
      const t=clamp((P-l.start)/.62);
      if(t>=1){ l.el.style.transform='none'; l.el.style.clipPath=''; return }
      const A=l.A, f=clamp(t/FLY), u=1-Math.pow(1-f,1.35);   // fast launch, gravity does the slowing
      let x=A.x0+(l.x-A.x0)*u, y=A.y0+A.B*u+A.C*u*u;
      if(t>FLY){ const s=(t-FLY)/(1-FLY); y+=l.h*.07*Math.sin(s*Math.PI)*(1-s) }   // lands, dips a hair, settles
      const rot=A.spin*Math.pow(1-u,1.6);                        // tumbles out, straightens as it lands
      const sc=A.pop+(1-A.pop)*clamp(u/.35)**.6;                 // grows as it clears the mouth
      const Mi=l.Mi, toLocal=(dx,dy)=>[Mi[0]*dx+Mi[1]*dy, Mi[2]*dx+Mi[3]*dy];
      place(l,x,y,rot,sc,isLand&&u<A.apex?rimY:null,toLocal);   // still coming out: hide whatever is below the rim
    });
  }
  frame.key=0;
  const nudge=d=>{ if(dt&&dt.isOn()) return; goal=clamp(goal+d); frame.force=true };
  home.addEventListener('wheel',e=>{ e.preventDefault(); nudge((e.deltaMode===1?e.deltaY*16:e.deltaY)/tune().wheel) },{passive:false});
  let ty=null;
  home.addEventListener('touchstart',e=>{ ty=e.touches[0].clientY },{passive:true});
  home.addEventListener('touchmove',e=>{ if(drag||ty===null) return; const y=e.touches[0].clientY; nudge((ty-y)/tune().swipe); ty=y },{passive:true});
  document.addEventListener('keydown',e=>{
    if(editing||e.target.closest('input,textarea,select,[contenteditable]')) return;
    const m={ArrowDown:.2,PageDown:.5,' ':.5,ArrowUp:-.2,PageUp:-.5}[e.key];
    if(m!==undefined){ e.preventDefault(); nudge(m) } else if(e.key==='End') nudge(1); else if(e.key==='Home') nudge(-1);
  });
  addEventListener('resize',()=>{ dirty=true; frame.force=true });
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ dirty=true; frame.force=true });
  split(); frame.force=true; requestAnimationFrame(frame);

  /* ---------- edit mode: content only (text + images). lives in the wrench bar ---------- */
  function setEditing(on){
    if(on===editing) return; editing=on;
    document.body.classList.toggle('editing',editing);
    if(dt) dt.pause(editing);                                     // da tools lets go of the assets while editing
    if(editing) join(); else { split(); frame.force=true }
    texts.forEach(el=>{ if(editing){ el.contentEditable='plaintext-only'; if(el.contentEditable!=='plaintext-only') el.contentEditable='true'; } else el.removeAttribute('contenteditable'); });
  }

  /* ---------- page panels handed to da tools: type + colour, background ---------- */
  const pick=ks=>()=>Object.fromEntries(ks.map(k=>[k,clone(S[k])]));
  const TEXT_K=['font','customFont','weight','size','stretch','fontStretch','tracking','textCase','italic','fvs','color','hover','menu'];
  const BG_K=['palette','bg','cycle','fade'];
  const setS=patch=>{ if(patch.customFont&&String(patch.customFont).trim()) S.font='Custom (Google Fonts name)'; Object.assign(S,patch); apply() };
  const PANELS=[
    {name:'text', label:'text', get title(){ return 'text · '+(orient==='land'?'landscape':'portrait') }, get:pick(TEXT_K), set:setS, reset:()=>setS(Object.fromEntries(TEXT_K.map(k=>[k,clone(DEFAULTS[orient][k])]))), controls:[
      {k:'font',label:'family',type:'select',options:Object.keys(FONTS)},
      {k:'customFont',label:'custom',type:'text',placeholder:'Google Fonts name'},
      {k:'weight',label:'weight',type:'range',min:100,max:1000,step:10},
      {k:'size',label:'size ×',type:'range',min:.2,max:4,step:.01},
      {k:'stretch',label:'widen ×',type:'range',min:.3,max:5,step:.01},
      {k:'fontStretch',label:'width %',type:'range',min:25,max:200,step:1},
      {k:'tracking',label:'tracking',type:'range',min:-.3,max:1.5,step:.005},
      {k:'textCase',label:'case',type:'select',options:['none','uppercase','lowercase','capitalize']},
      {k:'italic',label:'italic',type:'check'},
      {k:'fvs',label:'variation',type:'text',placeholder:'"wght" 300, "wdth" 150'},
      {k:'color',label:'colour',type:'color'},
      {k:'hover',label:'hover',type:'color'},
      {k:'menu',label:'menu on',type:'check'}]},
    {name:'background', get title(){ return 'bg · '+(orient==='land'?'landscape':'portrait') }, label:'bg', get:pick(BG_K), set:setS, reset:()=>setS(Object.fromEntries(BG_K.map(k=>[k,clone(DEFAULTS[orient][k])]))), controls:[
      {k:'palette',label:'palette',type:'colors'},
      {k:'bg',label:'showing #',type:'range',min:0,max:4,step:1},
      {k:'cycle',label:'click cycles',type:'check'},
      {k:'fade',label:'fade ms',type:'range',min:0,max:1500,step:10}]}
  ];

  /* ---------- da tools: move / resize / adjust any asset, password gated ---------- */
  // Jack's da tools exports (landscape 1544x808, portrait 411x744), refitted from the symbols to the words
  const DT_PORT={"bag":{"x":-11.33,"y":38.64,"s":1,"r":0,"o":1,"z":""},"jpg":{"x":4.39,"y":2.2,"s":0.965,"r":0,"o":1,"z":""},"mp3":{"x":27.81,"y":6.9,"s":0.659,"r":0,"o":1,"z":""},"mp4":{"x":-11.57,"y":-17.3,"s":0.722,"r":0,"o":1,"z":""}};
const DT_LAND={"bag":{"x":-19.87,"y":5.55,"s":1,"r":0,"o":1,"z":""},"jpg":{"x":14.72,"y":58.56,"s":1.094,"r":2.5,"o":1,"z":""},"mp3":{"x":58.38,"y":54.71,"s":1.14,"r":5.5,"o":0.93,"z":""},"mp4":{"x":56.19,"y":45.5,"s":0.84,"r":-9.5,"o":1,"z":""},"miss":{"x":71.31,"y":-49.03,"s":3.56,"r":0,"o":1,"z":""}};
  dt=DaTools.init({ password:'password', key:'bowman-home-v2-'+(land()?'land':'port'), defaults:land()?DT_LAND:DT_PORT,
    button:document.getElementById('wrench'), dock:'left', panels:PANELS,
    actions:[{label:'edit', toggle:true, onClick:on=>setEditing(on)}],
    onChange:()=>{ dirty=true; frame.force=true },                       // re-plot the arcs when a word or the bag moves
    onToggle:on=>{ if(!on) setEditing(false); if(on){ INTRO.done=true; wrenchRest(); if(miss&&MISS.x!==undefined) missAt(MISS.x,MISS.y,MISS.side*-9); goal=1; P=.999; frame.force=true } } });      // letters out of the bag while editing
})();
</script>
